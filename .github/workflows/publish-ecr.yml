# Publica lootea/chatwoot al mismo ECR que el backend (OIDC + tags SHA + alias).
name: Publish ECR image

on:
  workflow_call:
    inputs:
      alias_tag:
        description: Tag móvil (production)
        required: true
        type: string
    outputs:
      image:
        description: URI de la imagen con el SHA del commit
        value: ${{ jobs.publish.outputs.image }}
      registry:
        description: Host ECR (account.dkr.ecr.region.amazonaws.com)
        value: ${{ jobs.publish.outputs.registry }}
  workflow_dispatch:
    inputs:
      alias_tag:
        description: Tag móvil (production)
        required: true
        default: production
        type: string

jobs:
  publish:
    name: Publish lootea/chatwoot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      actions: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      registry: ${{ steps.ecr.outputs.registry }}
    env:
      ECR_REPOSITORY: lootea/chatwoot
      IMAGE_PLATFORM: linux/amd64
    steps:
      - name: Check AWS repository variables
        run: |
          if [ -z "${{ vars.ECR_PUSH_ROLE_ARN }}" ] || [ -z "${{ vars.ECR_AWS_REGION }}" ]; then
            echo "Set repository variables ECR_PUSH_ROLE_ARN and ECR_AWS_REGION (mismos que lootea-backend)."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.ECR_AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect SHA tag
        id: inspect
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          TAG="${IMAGE}:${SHA}"
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $TAG already exists; skip rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $TAG not in ECR; will build."
          fi

      - name: Checkout
        if: steps.inspect.outputs.exists != 'true'
        uses: actions/checkout@v4

      - name: Read upstream version
        if: steps.inspect.outputs.exists != 'true'
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION_CW)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.inspect.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.alias_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=chatwoot-amd64
          cache-to: type=gha,mode=max,scope=chatwoot-amd64

      - name: Promote mobile tags onto existing SHA
        if: steps.inspect.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
          ALIAS: ${{ inputs.alias_tag }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${ALIAS}" "${IMAGE}:${SHA}"

      - name: Export image URI
        id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
