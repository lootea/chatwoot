# Publica la imagen en ECR y el VPS tools solo hace pull.
name: Deploy Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish image
    uses: ./.github/workflows/publish-ecr.yml
    with:
      alias_tag: production
    permissions:
      contents: read
      id-token: write
      actions: write

  deploy:
    name: Deploy to tools
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.ECR_AWS_REGION }}

      - name: ECR login password for tools
        id: ecrpass
        run: |
          PASS="$(aws ecr get-login-password --region "${{ vars.ECR_AWS_REGION }}")"
          echo "::add-mask::${PASS}"
          echo "password=${PASS}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.PRODUCTION_APP_PATH }}
          CHATWOOT_IMAGE: ${{ needs.publish-image.outputs.image }}
          ECR_PASSWORD: ${{ steps.ecrpass.outputs.password }}
          ECR_REGISTRY: ${{ needs.publish-image.outputs.registry }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          envs: APP_DIR,CHATWOOT_IMAGE,ECR_PASSWORD,ECR_REGISTRY
          script_stop: true
          command_timeout: 60m
          script_path: .github/scripts/deploy_chatwoot.sh

      - name: Publish deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Production"
            echo ""
            echo "- Imagen: \`${{ needs.publish-image.outputs.image }}\`"
            echo "- Resultado del job: **${{ job.status }}**"
            echo "- Tools solo hace pull (no \`compose build\`)."
            echo "- Si aparece \`ROLLBACK_OCCURRED=1\` o un warning amarillo, el deploy nuevo falló y se restauró la imagen anterior (job en verde a propósito)."
            echo "- El rollback **no** revierte migraciones de DB; si \`db:chatwoot_prepare\` corrió, valida compatibilidad a mano."
          } >> "$GITHUB_STEP_SUMMARY"
