# Avisa a Slack cuando chatwoot/chatwoot publica un release estable o un GHSA.
name: Upstream watch

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    name: Check upstream release and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore watch state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/upstream-watch-state.json
          key: upstream-watch-state-${{ github.run_id }}
          restore-keys: |
            upstream-watch-state-

      - name: Compare and notify Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UPSTREAM_REPO: chatwoot/chatwoot
          STATE_FILE: /tmp/upstream-watch-state.json
        run: bash .github/scripts/upstream_watch.sh

      - name: Save watch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/upstream-watch-state.json
          key: upstream-watch-state-${{ github.run_id }}
