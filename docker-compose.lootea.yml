# Lootea production override — pull the versioned ECR image. Never build on tools.
#
# CHATWOOT_IMAGE is written to .env by deploy_chatwoot.sh (CI).
# Example: 893072529062.dkr.ecr.mx-central-1.amazonaws.com/lootea/chatwoot:<sha>
#
#   docker compose -f docker-compose.production.yaml -f docker-compose.lootea.yml pull
#   docker compose -f docker-compose.production.yaml -f docker-compose.lootea.yml up -d --no-build

services:
  base:
    image: ${CHATWOOT_IMAGE:?CHATWOOT_IMAGE}

  rails:
    image: ${CHATWOOT_IMAGE:?CHATWOOT_IMAGE}

  sidekiq:
    image: ${CHATWOOT_IMAGE:?CHATWOOT_IMAGE}

  postgres:
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
